<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="description" content="Create a TEXTILES static demo account." /><title>Create account | TEXTILES</title><link rel="stylesheet" href="Content/storefront.css" /></head>
<body data-page="account">
    <div id="site-header"></div>
    <main id="main-content" class="auth-page"><aside class="auth-aside"><div class="auth-aside-content"><p class="eyebrow">Made for you</p><h1>Find pieces you will live in.</h1><p>Join the TEXTILES community for a slower, more considered approach to getting dressed.</p></div></aside><section class="auth-main"><div class="auth-card"><h2>Create account</h2><p>A clean static form for the storefront experience.</p><form data-demo-form><div class="field"><label for="register-name">Full name</label><input id="register-name" required placeholder="Your full name" /></div><div class="field"><label for="register-email">Email address</label><input id="register-email" type="email" required placeholder="you@example.com" /></div><div class="field"><label for="register-password">Create a password</label><input id="register-password" type="password" required placeholder="At least 8 characters" /></div><button class="button button-primary button-block" type="submit">Create demo account</button><p class="form-status" role="status">Demo mode only — no account has been saved.</p></form><p class="helper-copy">Already have an account? <a href="login.html">Sign in</a></p></div></section></main>
    <div id="site-footer"></div><script src="Scripts/storefront.js"></script>
</body>
</html>
