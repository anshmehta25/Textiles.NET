<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="description" content="Complete your TEXTILES order." /><title>Checkout | TEXTILES</title><link rel="stylesheet" href="Content/storefront.css" /></head>
<body data-page="cart">
    <div id="site-header"></div>
    <main id="main-content" class="page-shell"><section class="section"><div class="container"><div class="breadcrumbs" style="color:#64748b;"><a href="index.html">Home</a><span>›</span><a href="cart.html">Your bag</a><span>›</span><span>Checkout</span></div><div class="page-heading" style="margin:20px 0 34px;"><h1 style="color:#17323f;">Checkout</h1><p>Complete your details to place the demo order.</p></div><form id="checkout-form" class="checkout-layout checkout-form"><div><section class="form-card"><h2>Contact details</h2><div class="form-row"><div class="field"><label for="checkout-name">Full name</label><input id="checkout-name" required placeholder="Your full name" /></div><div class="field"><label for="checkout-phone">Phone</label><input id="checkout-phone" required placeholder="Your phone number" /></div></div><div class="field"><label for="checkout-email">Email address</label><input id="checkout-email" type="email" required placeholder="you@example.com" /></div></section><section class="form-card"><h2>Delivery address</h2><div class="field"><label for="checkout-address">Address</label><textarea id="checkout-address" required placeholder="House number, street, city, state and PIN code"></textarea></div></section><section class="form-card"><h2>Payment</h2><div class="payment-method"><label><input type="radio" name="payment" checked /> Cash on delivery</label><label><input type="radio" name="payment" /> Card on delivery</label></div><p style="color:#64748b;font-size:.88rem;">No payment details are collected in this static demo.</p></section></div><aside class="summary-card"><h2>Order summary</h2><div class="summary-row"><span>Delivery</span><span>Free</span></div><div class="summary-row total"><span>Total</span><span id="checkout-total">₹0</span></div><button class="button button-primary button-block" type="submit">Place demo order</button></aside></form></div></section></main>
    <div id="site-footer"></div><script src="Scripts/storefront.js"></script>
</body>
</html>
